<html>
        <head><title>Downloaded HTML</title></head>
        <body>
            <pre style="white-space: pre-wrap; word-wrap: break-word;"><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brew Knowledge</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Press Start 2P', monospace, cursive;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;

  background-image: url('bg.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  overflow: hidden;
}

.app-container {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 40px 20px;
}

.header {
  margin-top: 20px;
  text-align: center;
  width: 100%;
}

.title-btn {
  background: none;
  border: none;
  cursor: pointer;
  transition: transform 0.2s ease;
  outline: none;
}

.title-btn:hover {
  transform: scale(1.03);
}

.title-btn:active {
  transform: scale(0.97);
}

.title-img {
  width: 100%;
  max-width: 340px;
  height: auto;
  display: block;
  margin: 0 auto;
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 22px;
  width: 100%;
  align-items: center;
}

.custom-btn {
  position: relative;
  width: 240px;
  height: 70px;
  border: none;
  cursor: pointer;
  
  background-image: url('button.png'); 
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-color: transparent;

  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.15s ease;
}

.custom-btn:hover {
  transform: translateY(-2px);
}

.custom-btn:active {
  transform: translateY(2px);
}

.btn-text {
  font-size: 0.95rem;
  color: #2b1a0e;
}

.disk-container {
  position: absolute;
  bottom: 25px;
  right: 20px;
}

.disk-btn {
  background: none;
  border: none;
  cursor: pointer;
  outline: none;
  border-radius: 50%;
}

.disk-img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  display: block;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}

.spinning .disk-img {
  animation: spin 6s linear infinite;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background-color: #6d4c41;
  border: 4px solid #4e342e;
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  color: #fff8e1;
  position: relative;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  background: none;
  border: none;
  font-size: 1.5rem;
  color: #fff8e1;
  cursor: pointer;
  font-family: inherit;
}

.modal-title {
  margin-bottom: 15px;
  font-size: 0.9rem;
  line-height: 1.4;
}

.cafe-image-container {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid #fff8e1;
}

.cafe-img {
  width: 100%;
  height: auto;
  display: block;
}
</style>
</head>
<body>

  <audio id="bg-audio" src="bgm.mp3" loop></audio>

  <main class="app-container">
    <div class="top-corner"></div>

    <header class="header">
      <button class="title-btn" id="brew-knowledge-btn" aria-label="Brew Knowledge Info">
        <img src="brew-knowledge.png" alt="Brew Knowledge" class="title-img" />
      </button>
    </header>

    <nav class="button-group">
      <button class="custom-btn" onclick="handleButtonClick('Order Up!')">
        <span class="btn-text">Order up!</span>
      </button>

      <button class="custom-btn" onclick="handleButtonClick('Menu')">
        <span class="btn-text">Menu</span>
      </button>

      <button class="custom-btn" onclick="handleButtonClick('About')">
        <span class="btn-text">About</span>
      </button>
    </nav>

    <div class="disk-container">
      <button id="disk-btn" class="disk-btn" aria-label="Toggle Audio">
        <img src="disk.png" alt="Music Disk" class="disk-img" />
      </button>
    </div>

  </main>

  <div id="cafe-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" id="close-modal">&times;</button>
      <h2 class="modal-title">Welcome to Our Cafe</h2>
      <div class="cafe-image-container">
        <img src="cafe.png" alt="Cafe Inside" class="cafe-img" />
      </div>
    </div>
  </div>

<script>
// Global click handler for inline HTML onclick attributes
function handleButtonClick(buttonName) {
  alert(`Clicked: ${buttonName}`);
}

document.addEventListener('DOMContentLoaded', () => {
  const audio = document.getElementById('bg-audio');
  const diskBtn = document.getElementById('disk-btn');
  const brewBtn = document.getElementById('brew-knowledge-btn');
  const modal = document.getElementById('cafe-modal');
  const closeModalBtn = document.getElementById('close-modal');

  let isPlaying = false;

  const startAudioOnInteraction = () => {
    if (!isPlaying) {
      audio.play().then(() => {
        isPlaying = true;
        diskBtn.classList.add('spinning');
      }).catch(err => console.log("Audio play waiting for interaction:", err));
    }
    document.removeEventListener('click', startAudioOnInteraction);
    document.removeEventListener('touchstart', startAudioOnInteraction);
  };

  document.addEventListener('click', startAudioOnInteraction);
  document.addEventListener('touchstart', startAudioOnInteraction);

  diskBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    
    if (isPlaying) {
      audio.pause();
      diskBtn.classList.remove('spinning');
      isPlaying = false;
    } else {
      audio.play().then(() => {
        diskBtn.classList.add('spinning');
        isPlaying = true;
      }).catch(err => console.log("Audio playback error:", err));
    }
  });

  brewBtn.addEventListener('click', () => {
    modal.classList.add('active');
  });

  closeModalBtn.addEventListener('click', () => {
    modal.classList.remove('active');
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.classList.remove('active');
    }
  });
});
</script>
</body>
</html></pre>
        </body>
    </html>
